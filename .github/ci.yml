name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Construir a imagem Docker
        run: docker build -t minha-app:ci .

      - name: Iniciar o contêiner
        run: docker run -d --name app -p 5000:5000 minha-app:ci

      - name: Aguardar a aplicação subir
        run: |
          for i in $(seq 1 15); do
            if curl -fs http://localhost:5000/health; then exit 0; fi
            sleep 2
          done
          docker logs app
          exit 1

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências de teste
        run: pip install -r requirements-dev.txt

      - name: Executar testes
        run: pytest -v

      - name: Mostrar logs do contêiner
        if: always()
        run: docker logs app

      - name: Remover contêiner
        if: always()
        run: docker rm -f app